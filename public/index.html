<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentis — chat en vivo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --paper:#15120e; --paper-raised:#1c1812; --ink:#f1e9db; --ink-dim:#c9beac;
    --ink-faint:#8c8172; --rule:#332c22; --accent-core:#f2a65a; --accent-product:#e8677d;
    --user-bubble:#2a2318;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; }
  header{ display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--rule); }
  header .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent-core); }
  header .name{ font-family:'Big Shoulders',sans-serif; font-weight:800; text-transform:uppercase; }
  header .tag{ font-size:0.68rem; color:var(--accent-core); border:1px solid var(--accent-core); padding:1px 7px; text-transform:uppercase; }
  header .mode{ margin-left:auto; font-size:0.72rem; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; }
  header .guias-btn{ background:none; border:1px solid var(--rule); color:var(--ink); padding:5px 10px; font-size:0.78rem; cursor:pointer; border-radius:4px; font-family:inherit; }
  header .guias-btn:hover{ border-color:var(--accent-core); color:var(--accent-core); }
  main{ max-width:680px; margin:0 auto; padding:24px 16px 140px; min-height:70vh; }
  .msg{ margin-bottom:18px; max-width:88%; padding:12px 16px; line-height:1.55; white-space:pre-wrap; }
  .msg.user{ margin-left:auto; background:var(--user-bubble); border:1px solid var(--rule); border-radius:14px 14px 4px 14px; }
  .msg.bot{ background:var(--paper-raised); border-left:3px solid var(--accent-core); border-radius:2px; }
  .msg.bot .label{ display:block; font-size:0.7rem; color:var(--accent-core); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; font-family:'IBM Plex Mono',monospace; }
  .composer{ position:fixed; bottom:0; left:0; right:0; background:rgba(21,18,14,0.95); border-top:1px solid var(--rule); max-width:680px; margin:0 auto; }
  .file-chip{ padding:10px 16px 0; }
  .file-chip span{ display:inline-flex; align-items:center; gap:8px; background:var(--paper-raised); border:1px solid var(--accent-core); color:var(--ink-dim); font-size:0.78rem; padding:6px 10px; border-radius:20px; max-width:100%; }
  .file-chip span .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
  .file-chip button{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:0.9rem; padding:0; line-height:1; flex:0 0 auto; }
  .file-chip button:hover{ color:var(--accent-product); }
  form{ padding:14px 16px; display:flex; gap:8px; }
  form input[type="text"]{ flex:1; min-width:0; background:var(--paper-raised); border:1px solid var(--rule); color:var(--ink); padding:12px 14px; font-family:inherit; font-size:0.95rem; }
  form input[type="text"]:focus{ outline:1px solid var(--accent-core); }
  form button[type="submit"]{ background:var(--accent-core); color:#1a1408; border:none; padding:0 20px; font-weight:600; cursor:pointer; }
  form button:disabled{ opacity:0.5; cursor:not-allowed; }
  .icon-btn{ flex:0 0 auto; width:44px; background:var(--paper-raised); border:1px solid var(--rule); color:var(--ink); border-radius:6px; cursor:pointer; font-size:1.05rem; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ border-color:var(--accent-core); }
  .icon-btn.active{ color:#1a1408; background:var(--accent-core); border-color:var(--accent-core); }
  .icon-btn:disabled{ opacity:0.35; cursor:not-allowed; }

  /* --- Acceso por email + guías dentro del chat (9/9/2026) -----------------
     Pedido explícito de Rodrigo: "gente tiene que tener acceso a las guías
     premium... cuando tiene acceso al chat, también tiene que tener
     automáticamente acceso a las guías premium... ponelo dentro del propio
     chat". Se aprovecha el mismo email que ya autentica /chat — nada nuevo
     que el cliente tenga que configurar aparte. */
  #gate{ position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  #gate.hidden{ display:none; }
  .gate-box{ max-width:360px; width:100%; text-align:center; }
  .gate-box h1{ font-family:'Big Shoulders',sans-serif; font-weight:800; text-transform:uppercase; font-size:1.3rem; margin:0 0 8px; }
  .gate-box p{ color:var(--ink-dim); font-size:0.88rem; line-height:1.5; margin:0 0 18px; }
  .gate-box input{ width:100%; background:var(--paper-raised); border:1px solid var(--rule); color:var(--ink); padding:12px 14px; font-family:inherit; font-size:0.95rem; margin-bottom:10px; }
  .gate-box button{ width:100%; background:var(--accent-core); color:#1a1408; border:none; padding:12px; font-weight:600; cursor:pointer; }
  .gate-box .err{ color:var(--accent-product); font-size:0.82rem; margin-top:10px; min-height:1em; }

  #guiasPanel{ position:fixed; inset:0; background:rgba(21,18,14,0.97); z-index:40; overflow-y:auto; padding:20px 16px 40px; }
  #guiasPanel.hidden{ display:none; }
  #guiasPanel .top{ max-width:680px; margin:0 auto 18px; display:flex; align-items:center; gap:10px; }
  #guiasPanel .top h2{ font-family:'Big Shoulders',sans-serif; font-weight:800; text-transform:uppercase; margin:0; flex:1; font-size:1.1rem; }
  #guiasPanel .top button{ background:none; border:1px solid var(--rule); color:var(--ink); width:32px; height:32px; cursor:pointer; border-radius:4px; }
  .guia-item{ max-width:680px; margin:0 auto 10px; display:flex; align-items:center; gap:12px; background:var(--paper-raised); border:1px solid var(--rule); border-radius:8px; padding:12px 14px; }
  .guia-item .info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .guia-item .titulo{ font-size:0.9rem; }
  .guia-item .tipo{ font-size:0.66rem; color:var(--accent-core); text-transform:uppercase; letter-spacing:.05em; font-family:'IBM Plex Mono',monospace; }
  .guia-item button{ flex:0 0 auto; background:var(--accent-core); color:#1a1408; border:none; padding:8px 14px; font-weight:600; cursor:pointer; font-size:0.82rem; border-radius:4px; }
  .guia-item button:disabled{ opacity:0.5; cursor:wait; }

  /* --- Cerebro con neuronas brillando (15/9/2026) ------------------------
     Pedido explícito de Rodrigo: "el chat premium está muy vacío
     estéticamente, quiero que el chat aparezca como de género de un
     cerebro que cada vez que envíe información se ilumine, que tenga como
     neuronas brillando". Reemplaza el punto simple del header por un
     ícono de cerebro dibujado a mano en SVG (sin ninguna imagen externa,
     mismo criterio del resto del proyecto) con "neuronas" (círculos) y
     "sinapsis" (líneas) adentro. Tres estados, controlados por JS con
     clases CSS:
       - .idle    → estado normal, un brillo suave tipo "respiración".
       - .thinking→ mientras se espera la respuesta de Mentis: las
                    neuronas titilan más rápido y las sinapsis "disparan"
                    (línea punteada animada), en tono coral para marcar
                    que está procesando.
       - .flash   → un destello breve de todo el cerebro apenas llega la
                    respuesta — el "se ilumine" del pedido — que se saca
                    solo (animationend) para volver a .idle.
     Se respeta prefers-reduced-motion apagando las animaciones para quien
     lo pidió a nivel sistema operativo, dejando solo el brillo fijo. */
  .brain-wrap{ width:34px; height:26px; flex:0 0 auto; display:flex; align-items:center; }
  .brain-wrap svg{ width:100%; height:100%; overflow:visible; }
  .brain-outline{ fill:none; stroke:var(--accent-core); stroke-width:2.2; opacity:0.6; }
  .brain-bridge{ stroke:var(--accent-core); stroke-width:1.4; opacity:0.4; }
  .synapse{ stroke:var(--accent-core); stroke-width:1.3; opacity:0.35; fill:none; }
  .neuron{ fill:var(--accent-core); filter:url(#neuronGlow); }

  #brain.idle .neuron{ animation:neuronBreathe 2.6s ease-in-out infinite; }
  #brain.idle .neuron:nth-child(odd){ animation-delay:-0.9s; }
  #brain.idle .neuron:nth-child(3n){ animation-delay:-1.7s; }

  #brain.thinking .brain-outline{ stroke:var(--accent-product); }
  #brain.thinking .neuron{ fill:var(--accent-product); filter:url(#neuronGlowStrong); animation:neuronFire 0.9s ease-in-out infinite; }
  #brain.thinking .neuron:nth-child(odd){ animation-delay:-0.3s; }
  #brain.thinking .neuron:nth-child(3n){ animation-delay:-0.55s; }
  #brain.thinking .synapse{ stroke:var(--accent-product); stroke-dasharray:4 3; opacity:0.8; animation:synapseTravel 0.6s linear infinite; }

  #brain.flash svg{ animation:brainFlash 0.7s ease-out; }

  @keyframes neuronBreathe{ 0%,100%{ opacity:0.4; transform:scale(1); } 50%{ opacity:1; transform:scale(1.15); } }
  @keyframes neuronFire{ 0%,100%{ opacity:0.5; transform:scale(1); } 50%{ opacity:1; transform:scale(1.35); } }
  @keyframes synapseTravel{ 0%{ stroke-dashoffset:14; } 100%{ stroke-dashoffset:0; } }
  @keyframes brainFlash{ 0%{ filter:brightness(1) drop-shadow(0 0 0 transparent); } 35%{ filter:brightness(2.4) drop-shadow(0 0 6px var(--accent-core)); } 100%{ filter:brightness(1) drop-shadow(0 0 0 transparent); } }

  @media (prefers-reduced-motion: reduce){
    #brain.idle .neuron, #brain.thinking .neuron, #brain.thinking .synapse, #brain.flash svg{ animation:none !important; }
    #brain.thinking .neuron{ opacity:0.9; }
  }

  /* Visuales y PDFs que devuelve el chat (gráficos/infografías generados
     al vuelo, o un PDF armado para esa respuesta puntual) — antes esto se
     generaba en el servidor (ver chat-render.js) pero el frontend nunca lo
     mostraba, solo el texto. "Que sea completo": ahora si la respuesta
     trae un gráfico SVG o un PDF, se muestran/enlazan igual que el texto. */
  .msg.bot-visual{ background:var(--paper-raised); border-left:3px solid var(--accent-core); border-radius:2px; padding:10px; }
  .msg.bot-visual svg{ width:100%; height:auto; display:block; border-radius:6px; }
  .msg.bot-pdf{ background:var(--paper-raised); border-left:3px solid var(--accent-core); border-radius:2px; }
  .msg.bot-pdf a{ color:var(--accent-core); font-weight:600; text-decoration:none; }
  .msg.bot-pdf a:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div id="gate">
    <div class="gate-box">
      <h1>Mentis premium</h1>
      <p>Ingresá el email con el que compraste el acceso — es lo que usamos para verificarlo, no hace falta contraseña.</p>
      <form id="gateForm">
        <input id="gateEmail" type="email" placeholder="tu@email.com" autocomplete="email" required>
        <button type="submit">Entrar</button>
      </form>
      <p class="err" id="gateErr"></p>
    </div>
  </div>

  <div id="guiasPanel" class="hidden">
    <div class="top">
      <h2>📚 Tus guías</h2>
      <button type="button" id="guiasClose" title="Cerrar">✕</button>
    </div>
    <div id="guiasList"></div>
  </div>

  <header>
    <span class="brain-wrap">
      <svg id="brain" class="idle" viewBox="0 0 120 90" role="img" aria-label="Cerebro de Mentis, brillando mientras piensa">
        <defs>
          <filter id="neuronGlow" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="1.6" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="neuronGlowStrong" x="-200%" y="-200%" width="500%" height="500%">
            <feGaussianBlur stdDeviation="2.6" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path class="brain-outline" d="M60,10 C45,2 25,4 18,18 C10,20 6,32 12,40 C6,48 10,60 20,64 C18,74 30,82 42,80 C48,86 56,86 60,80 C64,86 72,86 78,80 C90,82 102,74 100,64 C110,60 114,48 108,40 C114,32 110,20 102,18 C95,4 75,2 60,10 Z"/>
        <path class="brain-bridge" d="M60,14 C57,28 63,34 60,45 C57,56 63,62 60,78"/>
        <g class="synapse">
          <line x1="30" y1="30" x2="22" y2="45"/>
          <line x1="22" y1="45" x2="35" y2="55"/>
          <line x1="35" y1="55" x2="28" y2="65"/>
          <line x1="30" y1="30" x2="60" y2="45"/>
          <line x1="35" y1="55" x2="60" y2="45"/>
          <line x1="90" y1="30" x2="98" y2="45"/>
          <line x1="98" y1="45" x2="85" y2="55"/>
          <line x1="85" y1="55" x2="92" y2="65"/>
          <line x1="90" y1="30" x2="60" y2="45"/>
          <line x1="85" y1="55" x2="60" y2="45"/>
        </g>
        <circle class="neuron" cx="30" cy="30" r="4"/>
        <circle class="neuron" cx="22" cy="45" r="3.4"/>
        <circle class="neuron" cx="35" cy="55" r="3.6"/>
        <circle class="neuron" cx="28" cy="65" r="3.2"/>
        <circle class="neuron" cx="90" cy="30" r="4"/>
        <circle class="neuron" cx="98" cy="45" r="3.4"/>
        <circle class="neuron" cx="85" cy="55" r="3.6"/>
        <circle class="neuron" cx="92" cy="65" r="3.2"/>
        <circle class="neuron" cx="60" cy="45" r="4.2"/>
      </svg>
    </span>
    <span class="name">Mentis</span>
    <span class="tag">premium</span>
    <span class="mode" id="mode">verificando…</span>
    <button type="button" class="guias-btn" id="guiasBtn">📚 Guías</button>
  </header>
  <main id="chat"></main>

  <div class="composer">
    <div class="file-chip" id="fileChip" hidden></div>
    <form id="form">
      <input type="file" id="fileInput" hidden
        accept="image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain,text/markdown,text/csv,application/json,.md,.csv">
      <button type="button" class="icon-btn" id="attachBtn" title="Adjuntar archivo (imagen, PDF o texto)">📎</button>
      <button type="button" class="icon-btn" id="micBtn" title="Dictar por voz">🎤</button>
      <input id="input" type="text" placeholder="Escribí tu pregunta a Mentis…" autocomplete="off" required>
      <button type="submit">Enviar</button>
    </form>
  </div>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const modeLabel = document.getElementById('mode');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const fileChip = document.getElementById('fileChip');
  const micBtn = document.getElementById('micBtn');
  const brain = document.getElementById('brain');

  // Cerebro con neuronas — ver el comentario grande en el <style> de
  // arriba para el pedido original y el criterio de las 3 clases. Se
  // controla con esta única función para que nunca queden dos estados
  // pisándose (ej. "thinking" que nunca se saca porque el fetch falló).
  function setBrainState(state) {
    brain.classList.remove('idle', 'thinking', 'flash');
    brain.classList.add(state);
  }
  function flashBrain() {
    setBrainState('flash');
    brain.addEventListener('animationend', () => setBrainState('idle'), { once: true });
    // Si prefers-reduced-motion apagó la animación, 'animationend' nunca
    // dispara — sin este resguardo el cerebro quedaría trabado en modo
    // "flash" (que sin animación es un estado sin estilos propios, se ve
    // como apagado). Vuelve a 'idle' solo, un toque después.
    setTimeout(() => { if (brain.classList.contains('flash')) setBrainState('idle'); }, 750);
  }

  fetch('/health').then(r => r.json()).then(d => {
    modeLabel.textContent = d.mode === 'live' ? '● en vivo' : '● modo demo';
  }).catch(() => { modeLabel.textContent = 'sin conexión'; });

  function addMsg(text, who) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    if (who === 'bot') {
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = 'Mentis';
      div.appendChild(label);
      div.appendChild(document.createTextNode(text));
    } else {
      div.textContent = text;
    }
    chat.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  // --- Gráficos y PDFs que devuelve el chat (15/9/2026) ------------------
  // Pedido explícito de Rodrigo: "el chat disponibilice PDF, texto,
  // diagramas, etc que sea completo". El servidor (ver chat-render.js,
  // integrado a /chat en server.js) YA arma esto — un gráfico SVG inline
  // en data.visual, o un link a un PDF armado al vuelo en data.pdfUrl —
  // pero esta página nunca los mostraba, solo leía data.reply. Mismo
  // patrón que ya funciona en el chat del panel personal (panel.js,
  // addVisual/addPdfLink) — adaptado a los colores de esta página.
  function addVisual(svgString) {
    const div = document.createElement('div');
    div.className = 'msg bot bot-visual';
    div.innerHTML = svgString;
    chat.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
  function addPdfLink(url) {
    const div = document.createElement('div');
    div.className = 'msg bot bot-pdf';
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '📄 Descargar PDF';
    div.appendChild(a);
    chat.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  // --- Acceso por email (9/9/2026) --------------------------------------
  // Pedido explícito de Rodrigo: el chat exige un email con acceso premium
  // activo (REQUIRE_ACCESS_CHECK=true en el servidor, ver server.js,
  // validado contra access-premium.json que llenan los webhooks de
  // Systeme.io). Antes de este cambio el frontend nunca mandaba ningún
  // email — con el chequeo ya prendido del lado del servidor, nadie podía
  // pasar. Se guarda en localStorage para no pedirlo en cada visita; si el
  // servidor responde 401 (email sin acceso activo, o dado de baja), se
  // borra y se vuelve a pedir con el motivo.
  const gate = document.getElementById('gate');
  const gateForm = document.getElementById('gateForm');
  const gateEmail = document.getElementById('gateEmail');
  const gateErr = document.getElementById('gateErr');
  let mentisEmail = localStorage.getItem('mentisEmail') || '';

  function showGate(message) {
    gateErr.textContent = message || '';
    gate.classList.remove('hidden');
    gateEmail.focus();
  }
  function hideGate() { gate.classList.add('hidden'); }
  function handleUnauthorized(message) {
    localStorage.removeItem('mentisEmail');
    mentisEmail = '';
    showGate(message || 'Ese email no tiene acceso activo. Verificá que sea el mismo con el que compraste.');
  }

  if (mentisEmail) hideGate(); else showGate();

  gateForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const value = gateEmail.value.trim();
    if (!value) return;
    mentisEmail = value;
    localStorage.setItem('mentisEmail', mentisEmail);
    hideGate();
  });

  // --- Adjuntar archivo (imagen, PDF o texto) --------------------------------
  // Pedido explícito de Rodrigo (6/9/2026): "que Mentis Premium tenga la
  // opción de escribir por voz y poder cargar ficheros". El dictado por voz
  // es enteramente del lado del navegador (Web Speech API, ver
  // public/index.html) — nunca toca este servidor, solo dicta texto adentro
  // del mismo campo de siempre. Los archivos sí pasan por acá: el cliente
  // manda el archivo codificado en base64 dentro del mismo POST /chat de
  // siempre (un campo más, "archivo"), y el servidor arma el bloque de
  // contenido que corresponda para mandárselo a Claude.
  const MAX_FILE_MB = 20; // subido de 8 a 20 el 16/9/2026 — ver el comentario sobre CHAT_FILE_MAX_MB en server.js
  let pendingFile = null; // { nombre, tipo, datosBase64 } o null

  // --- Historial de la conversación (17/9/2026) --------------------------
  // Pedido explícito de Rodrigo: Mentis perdía el hilo entre preguntas y se
  // ponía a hablar de otra cosa. La causa real era que cada pregunta se
  // mandaba sola a la API, sin nada de lo hablado antes — esto lo arregla
  // del lado del navegador: guarda cada intercambio (lo que se ve en
  // pantalla) y lo manda junto con la pregunta nueva. Solo vive en memoria
  // de esta pestaña — se pierde si se recarga la página, a propósito (nunca
  // se guarda en localStorage, para no dejar conversaciones de un cliente
  // guardadas en el disco de otra persona que use la misma computadora).
  let historial = [];

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    fileInput.value = ''; // permite adjuntar el mismo archivo dos veces seguidas si hace falta
    if (!file) return;
    if (file.size > MAX_FILE_MB * 1024 * 1024) {
      addMsg(`"${file.name}" pesa más de ${MAX_FILE_MB}MB — no se puede adjuntar.`, 'bot');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = String(reader.result).split(',')[1] || '';
      pendingFile = { nombre: file.name, tipo: file.type || 'application/octet-stream', datosBase64: base64 };
      renderFileChip();
    };
    reader.onerror = () => addMsg(`No se pudo leer "${file.name}".`, 'bot');
    reader.readAsDataURL(file);
  });

  function renderFileChip() {
    fileChip.innerHTML = '';
    if (!pendingFile) { fileChip.hidden = true; return; }
    fileChip.hidden = false;
    const span = document.createElement('span');
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = '📎 ' + pendingFile.nombre;
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.textContent = '✕';
    removeBtn.title = 'Quitar archivo';
    removeBtn.addEventListener('click', () => { pendingFile = null; renderFileChip(); });
    span.appendChild(name);
    span.appendChild(removeBtn);
    fileChip.appendChild(span);
  }

  // --- Dictado por voz --------------------------------------------------------
  // Pedido explícito de Rodrigo (6/9/2026): "que Mentis Premium tenga la
  // opción de escribir por voz". Enteramente del lado del navegador (Web
  // Speech API) — nunca toca el servidor, solo dicta texto adentro del
  // mismo campo de siempre; el cliente sigue apretando "Enviar" como
  // siempre. No todos los navegadores la soportan (Chrome/Edge/Safari sí,
  // Firefox no) — si no está disponible, el botón queda deshabilitado con
  // una explicación en el título, en vez de fallar en silencio al tocarlo.
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognitionCtor) {
    const recognition = new SpeechRecognitionCtor();
    recognition.lang = 'es-ES';
    recognition.continuous = false;
    recognition.interimResults = true;
    let recognizing = false;
    let baseText = '';

    recognition.addEventListener('start', () => {
      recognizing = true;
      baseText = input.value.trim() ? input.value.trim() + ' ' : '';
      micBtn.classList.add('active');
      micBtn.textContent = '⏹';
      micBtn.title = 'Detener dictado';
    });
    recognition.addEventListener('result', (e) => {
      let transcript = '';
      for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
      input.value = baseText + transcript;
    });
    recognition.addEventListener('end', () => {
      recognizing = false;
      micBtn.classList.remove('active');
      micBtn.textContent = '🎤';
      micBtn.title = 'Dictar por voz';
      input.focus();
    });
    recognition.addEventListener('error', (e) => {
      recognizing = false;
      micBtn.classList.remove('active');
      micBtn.textContent = '🎤';
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        addMsg('No se pudo usar el micrófono (' + e.error + '). Revisá los permisos del navegador.', 'bot');
      }
    });
    micBtn.addEventListener('click', () => {
      if (recognizing) { recognition.stop(); return; }
      try { recognition.start(); } catch (err) { /* ya estaba escuchando — se ignora */ }
    });
  } else {
    micBtn.disabled = true;
    micBtn.title = 'Dictado por voz no disponible en este navegador (probá con Chrome, Edge o Safari)';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    const archivo = pendingFile;
    addMsg(message + (archivo ? `\n📎 ${archivo.nombre}` : ''), 'user');
    input.value = '';
    input.disabled = true;
    pendingFile = null;
    renderFileChip();

    setBrainState('thinking'); // se ilumina/titila más rápido mientras Mentis procesa — pedido explícito de Rodrigo
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-mentis-email': mentisEmail },
        body: JSON.stringify({ message, ...(archivo ? { archivo } : {}), historial }),
      });
      if (res.status === 401) {
        const data = await res.json().catch(() => ({}));
        setBrainState('idle');
        handleUnauthorized(data.error);
        return;
      }
      const data = await res.json();
      flashBrain(); // el destello del cerebro justo cuando llega la respuesta
      addMsg(data.reply || data.error || 'No hubo respuesta.', 'bot');
      if (data.visual) addVisual(data.visual);
      if (data.pdfUrl) addPdfLink(data.pdfUrl);
      // Suma este intercambio al historial recién después de una respuesta
      // real — si falló (catch de abajo) no se guarda nada, así un error de
      // red no le hace creer a Mentis que ya contestó algo que nunca mandó.
      if (data.reply) {
        historial.push({ role: 'user', text: message });
        historial.push({ role: 'assistant', text: data.reply });
      }
    } catch (err) {
      setBrainState('idle');
      addMsg('No se pudo conectar con Mentis. Revisá que el servidor esté corriendo.', 'bot');
    } finally {
      input.disabled = false;
      input.focus();
    }
  });

  // --- Guías dentro del chat (9/9/2026) ----------------------------------
  // Pedido explícito de Rodrigo: "gente tiene que tener acceso a las guías
  // premium... cuando tiene acceso al chat, también tiene que tener
  // automáticamente acceso a las guías premium... y lo puedes poner dentro
  // del propio chat, guías, y ya". Reusa el mismo email que ya valida
  // /chat (mismo header, mismo REQUIRE_ACCESS_CHECK del lado del
  // servidor) — nada nuevo que el cliente tenga que configurar aparte, y
  // ve TODO el catálogo (gratis y premium), no solo lo que ManyChat manda
  // por DM.
  const guiasBtn = document.getElementById('guiasBtn');
  const guiasPanel = document.getElementById('guiasPanel');
  const guiasList = document.getElementById('guiasList');
  const guiasClose = document.getElementById('guiasClose');

  function guiaMsg(text, color) {
    return '<p style="color:' + (color || 'var(--ink-faint)') + ';max-width:680px;margin:0 auto;">' + text + '</p>';
  }

  guiasBtn.addEventListener('click', async () => {
    guiasPanel.classList.remove('hidden');
    guiasList.innerHTML = guiaMsg('Cargando…');
    try {
      const res = await fetch('/chat/guias', { headers: { 'x-mentis-email': mentisEmail } });
      if (res.status === 401) {
        const data = await res.json().catch(() => ({}));
        guiasPanel.classList.add('hidden');
        handleUnauthorized(data.error);
        return;
      }
      const data = await res.json();
      if (!data.ok || !data.guias || data.guias.length === 0) {
        guiasList.innerHTML = guiaMsg('Todavía no hay guías cargadas.');
        return;
      }
      guiasList.innerHTML = '';
      data.guias.forEach((g) => {
        const item = document.createElement('div');
        item.className = 'guia-item';

        const info = document.createElement('div');
        info.className = 'info';
        const tipo = document.createElement('span');
        tipo.className = 'tipo';
        tipo.textContent = g.tipo === 'premium' ? '★ premium' : 'gratis';
        const titulo = document.createElement('span');
        titulo.className = 'titulo';
        titulo.textContent = g.titulo;
        info.appendChild(tipo);
        info.appendChild(titulo);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'Abrir PDF';
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          btn.textContent = 'Abriendo…';
          try {
            const pdfRes = await fetch('/chat/guia/' + encodeURIComponent(g.id), { headers: { 'x-mentis-email': mentisEmail } });
            if (pdfRes.status === 401) {
              const data2 = await pdfRes.json().catch(() => ({}));
              guiasPanel.classList.add('hidden');
              handleUnauthorized(data2.error);
              return;
            }
            if (!pdfRes.ok) throw new Error('No se pudo abrir');
            const blob = await pdfRes.blob();
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
          } catch (err) {
            alert('No se pudo abrir esa guía. Probá de nuevo.');
          } finally {
            btn.disabled = false;
            btn.textContent = 'Abrir PDF';
          }
        });

        item.appendChild(info);
        item.appendChild(btn);
        guiasList.appendChild(item);
      });
    } catch (err) {
      guiasList.innerHTML = guiaMsg('No se pudo cargar la lista de guías.', 'var(--accent-product)');
    }
  });

  guiasClose.addEventListener('click', () => guiasPanel.classList.add('hidden'));
</script>
</body>
</html>
