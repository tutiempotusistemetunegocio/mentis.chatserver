name: Regenerar PDFs de guías

# Herramienta puntual, NO recurrente (sin `schedule`, solo se dispara a
# mano) — vuelve a armar el PDF de las guías que ya existen en el catálogo,
# a partir del mismo .md ya guardado en Dropbox (nunca le pide contenido
# nuevo a Mentis). Pensada para el día que se corrige un bug de armado en
# guide-pdf.js (como el de las páginas en blanco del 3/9/2026) y los PDFs
# viejos, ya entregados con el bug, también necesitan rehacerse — no solo
# las guías nuevas de acá en adelante.
#
# Configuración: usa los mismos dos secrets que "Guías semanales de Mentis"
# (MENTIS_GUIDES_URL, MENTIS_GUIDES_SECRET) — es el mismo módulo, no hace
# falta cargar nada nuevo en GitHub. La URL de este workflow se arma
# recortando "weekly-guides" del final de MENTIS_GUIDES_URL y pegando
# "regenerate-guide-pdfs" en su lugar (mismo servidor, otra ruta).

on:
  workflow_dispatch: {}

jobs:
  regenerar:
    runs-on: ubuntu-latest
    env:
      MENTIS_GUIDES_URL: ${{ secrets.MENTIS_GUIDES_URL }}
      MENTIS_GUIDES_SECRET: ${{ secrets.MENTIS_GUIDES_SECRET }}
    steps:
      - name: Regenerar todos los PDFs del catálogo
        run: |
          url="${MENTIS_GUIDES_URL%weekly-guides}regenerate-guide-pdfs"
          echo "Llamando a: $url"
          # Generoso a propósito: puede haber varias guías en el catálogo, y
          # cada PDF (aunque es barato, no usa la API de Claude) igual tarda
          # unos segundos en armarse + subirse a Dropbox uno por uno.
          #
          # --retry: el servidor gratis de Render se apaga solo después de
          # 15 min sin uso — el primer pedido lo despierta pero puede llegar
          # antes de que esté listo y recibir un 502 de Render mientras
          # arranca (ya pasó una vez antes, con la lectura diaria). En vez de
          # que Rodrigo tenga que reintentar a mano, curl reintenta solo
          # hasta 3 veces con una pausa de por medio.
          response=$(curl -s -w "\n%{http_code}" --max-time 600 --retry 3 --retry-delay 15 --retry-all-errors -X POST "$url" \
            -H "x-guides-secret: $MENTIS_GUIDES_SECRET" \
            -H "content-type: application/json" \
            -d '{}')
          curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            echo "La regeneración de PDFs falló — no hubo respuesta del servidor a tiempo (curl exit $curl_exit, probablemente un timeout)."
            exit 1
          fi
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" -ge 400 ]; then
            echo "La regeneración de PDFs falló — revisá el mensaje de arriba."
            exit 1
          fi
