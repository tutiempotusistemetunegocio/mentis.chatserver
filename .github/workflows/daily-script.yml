name: Guion diario de Mentis

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch: {}

jobs:
  generar-guion:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de guion diario
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST "${{ secrets.MENTIS_SCRIPT_URL }}" -H "x-script-secret: ${{ secrets.MENTIS_SCRIPT_SECRET }}")
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Fallo la llamada"
            exit 1
          fi
