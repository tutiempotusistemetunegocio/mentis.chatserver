name: Video diario de Mentis

# PENDIENTE DE UNA CONFIRMACIÓN MANUAL (2/9/2026): Rodrigo pasó su cuenta de
# Higgsfield al plan Plus, que da acceso a los modelos Seedance — con eso ya
# resuelto, se actualizó daily-media.js con el modelo correspondiente
# (ver el comentario largo ahí, incluye el caveat de que es la lectura más
# razonable de la documentación pública, no algo ya probado contra la cuenta
# real). El cron sigue apagado a propósito por un paso más: hay que
# confirmar con un "Run workflow" manual acá abajo que ya no da 404 antes de
# prender el cron diario de nuevo — así, si el modelo elegido no es el
# correcto, es un solo intento fallido y no toda una semana de runs rojos.
# Una vez confirmado un run exitoso, descomentar la línea de "schedule" de
# abajo. Ver daily-media.md.
on:
  # - cron: '45 10 * * *'
  workflow_dispatch: {}

jobs:
  pedir-clip:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de video diario
        run: |
          # --max-time (afinado 2/9/2026): este paso solo pide el clip, no
          # espera a que Higgsfield lo termine (eso llega después por
          # webhook), así que la respuesta debería ser rápida — 1 minuto es
          # generoso para evitar quedarse esperando en silencio si se cuelga.
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" --max-time 60 -X POST "${{ secrets.MENTIS_MEDIA_URL }}" -H "x-media-secret: ${{ secrets.MENTIS_MEDIA_SECRET }}")
          curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            echo "Fallo la llamada — no hubo respuesta del servidor a tiempo (curl exit $curl_exit, probablemente un timeout)."
            exit 1
          fi
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Fallo la llamada"
            exit 1
          fi
