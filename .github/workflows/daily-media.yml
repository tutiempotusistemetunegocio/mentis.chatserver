name: Video diario de Mentis

on:
  schedule:
    - cron: '45 10 * * *'
  workflow_dispatch: {}

jobs:
  pedir-clip:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de video diario
        run: |
          # --max-time (afinado 2/9/2026): este paso solo pide el clip, no
          # espera a que Higgsfield lo termine (eso llega después por
          # webhook), así que la respuesta debería ser rápida — 1 minuto es
          # generoso para evitar quedarse esperando en silencio si se cuelga.
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" --max-time 60 -X POST "${{ secrets.MENTIS_MEDIA_URL }}" -H "x-media-secret: ${{ secrets.MENTIS_MEDIA_SECRET }}")
          curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            echo "Fallo la llamada — no hubo respuesta del servidor a tiempo (curl exit $curl_exit, probablemente un timeout)."
            exit 1
          fi
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Fallo la llamada"
            exit 1
          fi
