name: Video diario de Mentis

on:
  schedule:
    - cron: '45 10 * * *'
  workflow_dispatch: {}

jobs:
  pedir-clip:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de video diario
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST "${{ secrets.MENTIS_MEDIA_URL }}" -H "x-media-secret: ${{ secrets.MENTIS_MEDIA_SECRET }}")
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Fallo la llamada"
            exit 1
          fi
