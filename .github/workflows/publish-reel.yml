name: Publicar reel en Buffer

on:
  # No depende de ningún horario fijo — Rodrigo arma el video a mano y lo
  # sube cuando lo tiene listo (a veces el mismo día, a veces días después).
  # Por eso el uso normal es disparar esto A MANO ("Run workflow") apenas
  # subís el reel a la carpeta, en vez de esperar al cron de abajo. El cron
  # queda solo como red de contención por si te olvidás.
  workflow_dispatch: {}
  schedule:
    - cron: '0 18 * * *'

jobs:
  publicar-reel-borrador:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de publicar el reel listo
        run: |
          # BUG REAL encontrado el 7/9/2026: bash corre estos pasos con "-e"
          # (se ve abajo, "shell: /usr/bin/bash -e {0}") — con esa opción, si
          # "HTTP_CODE=$(curl ...)" falla, el script entero se corta AHÍ
          # MISMO, antes de llegar siquiera a la línea "curl_exit=$?" de
          # abajo. Por eso la corrida anterior solo mostró "Process
          # completed with exit code 1" sin ningún mensaje propio — el "||
          # true" al final de esta línea evita que "-e" corte de golpe, así
          # el resto del script sí llega a explicar qué pasó.
          #
          # --max-time más alto que el de la foto (240 en vez de 180): esta
          # llamada le pide a Buffer que acepte un video, no una foto, y
          # puede tardar más en validarlo del lado de Buffer.
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" --max-time 240 -X POST "${{ secrets.MENTIS_BUFFER_REEL_URL }}" -H "x-buffer-secret: ${{ secrets.MENTIS_BUFFER_SECRET }}") || true
          curl_exit=$?
          if [ "$curl_exit" -ne 0 ] || [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "Fallo la llamada antes de recibir respuesta — puede ser que MENTIS_BUFFER_REEL_URL esté vacío o mal cargado en los secrets de GitHub, o que el servidor no haya respondido a tiempo (curl exit $curl_exit, HTTP status visto: '$HTTP_CODE')."
            exit 1
          fi
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Fallo la llamada"
            exit 1
          fi
