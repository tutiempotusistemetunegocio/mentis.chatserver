name: Lectura diaria de Mentis

# Dispara la lectura diaria (Módulo 01 → conocimiento) una vez al día,
# llamando al servidor ya desplegado en Render. No corre nada acá adentro —
# solo hace un POST protegido con un secreto, el trabajo real (leer Dropbox,
# clasificar con la API de Claude, actualizar el conocimiento) pasa en el
# servidor. Así el secreto de Dropbox y la clave de la API nunca salen de
# Render.
#
# Configuración necesaria, una sola vez, en GitHub:
#  Settings → Secrets and variables → Actions → New repository secret
#   - MENTIS_INGEST_URL: la URL completa, por ejemplo
#     https://mentis-chatserver.onrender.com/internal/daily-ingest
#   - MENTIS_INGEST_SECRET: el mismo valor que INGEST_SECRET en Render

on:
  schedule:
    # 10:00 UTC todos los días — ajustable. Corre antes de la generación de
    # contenido de las 7am hora de Rodrigo (Módulo 03), para que el guion del
    # día ya cuente con cualquier libro subido el día anterior.
    - cron: '0 10 * * *'
  workflow_dispatch: {} # permite dispararla a mano desde la pestaña "Actions" de GitHub, para probar

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar el servidor antes del pedido real
        run: |
          # Agregado 6/9/2026: Rodrigo confirmó que la corrida de la mañana
          # casi nunca funciona (18 corridas: las que fallan son siempre las
          # de la mañana temprano; las que salieron bien fueron disparadas a
          # mano de noche) — mientras que corrida a mano más tarde en el día
          # suele andar bien. Lectura más razonable: a las 10:00 UTC, Render
          # (plan free) lleva toda la noche dormido (se apaga a los 15 min sin
          # uso) — el primer pedido del día tiene que despertarlo Y ADEMÁS
          # hacer el trabajo pesado (Dropbox + API de Claude) en el mismo
          # golpe, y ese arranque en frío es lo más probable detrás del 502.
          # Este paso separa las dos cosas: golpea /health (liviano, sin
          # Dropbox ni Claude, ver server.js) hasta que responda 200, ANTES
          # de disparar el pedido real de abajo. Si no despierta en el tiempo
          # dado, se sigue igual con el pedido real — en el peor caso, el
          # comportamiento es el mismo que antes de este cambio.
          health_url="${{ secrets.MENTIS_INGEST_URL }}"
          health_url="${health_url%/internal/daily-ingest}/health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$health_url" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "Servidor despierto (intento $i, HTTP $code)."
              exit 0
            fi
            echo "Intento $i: HTTP $code todavía — esperando 10s..."
            sleep 10
          done
          echo "El servidor no confirmó estar despierto tras varios intentos — sigo igual con el pedido real, por si acaso."

      - name: Disparar la lectura diaria
        run: |
          # --max-time (afinado 2/9/2026, auditoría de confiabilidad): sin esto,
          # si el servidor se cuelga en vez de responder, este paso se queda
          # esperando en silencio en vez de fallar limpio y avisar. 4 minutos
          # alcanza de sobra: son hasta 3 documentos por corrida, y cada uno ya
          # tiene su propio límite interno más corto (ver dropbox-auth.js).
          response=$(curl -s -w "\n%{http_code}" --max-time 240 -X POST "${{ secrets.MENTIS_INGEST_URL }}" \
            -H "x-ingest-secret: ${{ secrets.MENTIS_INGEST_SECRET }}" \
            -H "content-type: application/json")
          curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            echo "La lectura diaria falló — no hubo respuesta del servidor a tiempo (curl exit $curl_exit, probablemente un timeout)."
            exit 1
          fi
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" -ge 400 ]; then
            echo "La lectura diaria falló — revisá el mensaje de arriba."
            exit 1
          fi
