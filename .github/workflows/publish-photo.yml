name: Publicar foto diaria en Buffer

on:
  schedule:
    # 10 minutos después de "Foto diaria de Mentis" (10:40 UTC) — le da tiempo
    # a que esa corrida termine y guarde su elección en Dropbox antes de que
    # esta la lea.
    - cron: '50 10 * * *'
  workflow_dispatch: {}

jobs:
  publicar-borrador:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de publicar la foto del día
        run: |
          # --max-time: mismo motivo que el resto de los workflows — evita
          # quedarse esperando en silencio si el servidor se cuelga o está
          # despertando (Render, plan free, se apaga a los 15 min sin uso).
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" --max-time 180 -X POST "${{ secrets.MENTIS_BUFFER_URL }}" -H "x-buffer-secret: ${{ secrets.MENTIS_BUFFER_SECRET }}")
          curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            echo "Fallo la llamada — no hubo respuesta del servidor a tiempo (curl exit $curl_exit, probablemente un timeout)."
            exit 1
          fi
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Fallo la llamada"
            exit 1
          fi
