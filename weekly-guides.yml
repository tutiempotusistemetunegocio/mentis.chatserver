name: Guías diarias de Mentis

# Dispara el armado de guías (Módulo 02 → weekly-guides.js — el archivo
# mantiene su nombre viejo a propósito, para no tener que tocar
# MENTIS_GUIDES_URL/MENTIS_GUIDES_SECRET en GitHub/Render ni la ruta que ya
# usa regenerateguidepdfs.yml) — arma hasta GUIDES_PER_RUN_FREE gratis +
# GUIDES_PER_RUN_PREMIUM premium (1 y 1 por default) cada vez que corre,
# EN PAR y sobre el MISMO tema (misma combinación de categorías para la
# gratis y la premium de cada par). Mismo patrón que los otros workflows: no
# hace nada acá adentro, solo llama al servidor ya desplegado en Render con
# un secreto propio.
#
# CAMBIADO A DIARIO (27/9/2026, pedido explícito de Rodrigo): "los reels...
# quiero que sean sobre las guías... las guías tienen que ser diarias" — este
# workflow pasó de correr una vez por semana a correr todos los días, ANTES
# del guion diario del reel (daily-script.yml, 10:30 UTC), para que
# daily-script.js pueda leer la guía gratis recién armada de hoy y escribir
# el reel sobre ese mismo tema (ver fetchTodaysGuide() en daily-script.js).
# El orden real de la mañana queda: 10:00 lectura diaria → 10:15 esta guía →
# 10:30 guion del reel.
#
# Para juntar guías rápido (o para el arranque de 10+10 gratis+premium antes
# de vender): disparar este workflow a mano varias veces seguidas desde la
# pestaña "Actions" de GitHub (botón "Run workflow") — el mismo truco que ya
# se usó para ponerse al día con el backlog de libros de la lectura diaria.
#
# Configuración necesaria, una sola vez, en GitHub:
#  Settings → Secrets and variables → Actions → New repository secret
#   - MENTIS_GUIDES_URL: la URL completa, por ejemplo
#     https://mentis-chatserver.onrender.com/internal/weekly-guides
#   - MENTIS_GUIDES_SECRET: el mismo valor que GUIDES_SECRET en Render

on:
  schedule:
    # 10:15 UTC, todos los días — 15 minutos después de que termina de
    # correr la lectura diaria (10:00 UTC) y 15 minutos antes del guion del
    # reel (10:30 UTC), para que la guía de hoy ya esté lista cuando
    # daily-script.js la va a buscar. Ajustable.
    - cron: '15 10 * * *'
  workflow_dispatch: {} # permite dispararlo a mano, cuantas veces haga falta, para probar o ponerse al día

jobs:
  guias:
    runs-on: ubuntu-latest
    steps:
      - name: Armar guías nuevas
        run: |
          # --max-time generoso: con el default de 1+1 (un par, 2 guías) esto
          # sobra de sobra, pero se deja así por si Rodrigo sube
          # GUIDES_PER_RUN_FREE/PREMIUM por variable de entorno — cada
          # premium puede tardar hasta 5 minutos (ver weekly-guides.js) —
          # 25 minutos da margen real sin quedarse esperando en silencio si
          # el servidor se cuelga (ver la auditoría de confiabilidad del
          # 2/9/2026 en los otros workflows).
          response=$(curl -s -w "\n%{http_code}" --max-time 1500 -X POST "${{ secrets.MENTIS_GUIDES_URL }}" \
            -H "x-guides-secret: ${{ secrets.MENTIS_GUIDES_SECRET }}" \
            -H "content-type: application/json")
          curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            echo "El armado de guías falló — no hubo respuesta del servidor a tiempo (curl exit $curl_exit, probablemente un timeout)."
            exit 1
          fi
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" -ge 400 ]; then
            echo "El armado de guías falló — revisá el mensaje de arriba."
            exit 1
          fi
